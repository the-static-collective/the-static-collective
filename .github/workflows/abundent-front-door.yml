name: Abundent front door
on:
  pull_request:
    paths:
      - 'front-door/**'
      - '.github/workflows/abundent-front-door.yml'
  push:
    paths:
      - 'front-door/**'
      - '.github/workflows/abundent-front-door.yml'
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Human / machine split and staging gates
        run: cd front-door && python -m unittest discover -s tests -v
      - name: Porch and cross-repository operator route unit tests
        run: node --test front-door/porch/*.test.mjs front-door/work/*.test.mjs
      - name: Check out exact original webZ public crossing contract
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/webZ
          ref: 963b047a414a5822a82681fd838dfdadeb5c8c41
          path: native-webz
          persist-credentials: false
      - name: Independent native webZ receiver compatibility
        env:
          WEBZ_NATIVE_ROOT: native-webz
        run: node --test front-door/work/crossing-native.test.mjs
      - name: First-party browser scripts parse
        run: node --check front-door/porch/app.mjs && node --check front-door/porch/private-inbox.mjs && node --check front-door/feedback/widget.mjs && node --check front-door/try/demo.mjs && node --check front-door/work/app.mjs && node --check front-door/work/router.mjs && node --check front-door/work/crossing-bridge.mjs

      - name: Confirm public first-party pages resolve through actual DNS
        run: node front-door/tests/live-http.mjs
