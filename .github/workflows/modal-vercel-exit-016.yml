name: Agent Commons 016 — modal without Vercel
on:
  pull_request:
    paths:
      - 'agent-commons/modal/**'
      - 'agent-commons/supabase/agent-commons-frontdoor-016.ts'
      - 'agent-commons/tests/test_modal_service.py'
      - '.github/workflows/modal-vercel-exit-016.yml'
  push:
    branches:
      - 'feature/modal-vercel-exit-016'
    paths:
      - 'agent-commons/modal/**'
      - 'agent-commons/supabase/agent-commons-frontdoor-016.ts'
      - 'agent-commons/tests/test_modal_service.py'
      - '.github/workflows/modal-vercel-exit-016.yml'
  workflow_dispatch:
    inputs:
      deploy_confirm:
        description: 'Type DEPLOY_MODAL_ONLY to run the explicit Modal deployment job'
        required: true
        type: string
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run entirely local mocked web + provider tests
        run: |
          python -m pip install fastapi==0.128.2 httpx==0.28.1 pytest==9.0.2
          python -m py_compile agent-commons/modal/service.py agent-commons/modal/entrypoint.py
          python -m pytest -q agent-commons/tests/test_modal_service.py
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_confirm == 'DEPLOY_MODAL_ONLY' }}
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Refuse unconfigured Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_DEPLOY_HOLD: missing token id'; exit 3; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_DEPLOY_HOLD: missing token secret'; exit 3; }
      - name: Deploy reviewed source to Modal, never Vercel
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python -m pip install 'modal>=1.1,<2'
          modal deploy agent-commons/modal/entrypoint.py